<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GHW — Normalização de dados</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="loja">
  <div class="pagina">
    <header class="loja-topo">
      <div class="loja-marca"><strong>GHW</strong><span>normalização de dados — o bruto entra uma vez</span></div>
      <button class="btn-primary" id="btnImportar" type="button">+ Importar arquivo</button>
    </header>

    <p class="muted">Os apps leem este resultado — sem cópia local, sem reimportar, sem detalhe de nota fiscal.</p>

    <main id="dados"></main>

    <footer class="loja-rodape">
      <a href="index.html">← Voltar às funções</a>
    </footer>
  </div>

  <!-- Popup importar -->
  <div class="overlay" id="overlayImportar" hidden>
    <div class="popup" role="dialog" aria-modal="true" aria-labelledby="impTitulo">
      <header>
        <div><h2 id="impTitulo">Importar arquivo</h2><p>O arquivo entra uma única vez. O GHW identifica, normaliza e grava em ghw_dados.</p></div>
        <button class="x" id="impFechar" type="button" aria-label="Fechar">×</button>
      </header>
      <label class="drop" for="impFile">Arraste a NF-e, o extrato ou a folha para cá — ou clique para escolher<input id="impFile" type="file" hidden /></label>
      <p class="copiado" id="impOk" hidden>Escolha um arquivo para começar.</p>
      <div class="pop-actions">
        <button class="btn-primary grow" id="impEnviar" type="button">Enviar para normalizar</button>
        <button class="btn-ghost" id="impFechar2" type="button">Fechar</button>
      </div>
    </div>
  </div>

  <script src="dados.js"></script>
</body>
</html>
